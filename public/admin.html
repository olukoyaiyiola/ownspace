<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OwnSpace | Team dashboard</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><a class="brand" href="/">◈ OwnSpace</a><a class="smallbtn" href="/">← Website</a></header><main class="admin"><div class="eyebrow">TEAM WORKSPACE</div><h1>OwnSpace Studio</h1><p class="muted">Content, collaborators, commerce and concierge in one place.</p><div id="message" class="notice" role="status"></div><section id="auth" class="panel"><h2>Sign in</h2><form id="login"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn">Sign in</button></form><details><summary>First-time owner setup</summary><p>Only works before the first user has been created. Configure SETUP_KEY as a Cloudflare secret first.</p><form id="setup"><label>Setup key<input name="setupKey" type="password" required></label><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Password (12+ characters)<input name="password" type="password" minlength="12" required></label><button class="btn">Create owner</button></form></details></section><section id="workspace" class="hide"><div class="panel"><strong id="who"></strong> <button id="logout" class="btn secondary">Sign out</button><div id="stats" class="muted"></div></div><nav id="tabs"></nav><section class="panel"><h2 id="sectiontitle">Dashboard</h2><div id="editor"></div><div id="records" class="table"></div></section></section></main><script src="/admin.js" defer></script></body></html>
